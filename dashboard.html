<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QuantBot Asset Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --text: #1f2933;
      --muted: #64707d;
      --line: #d9dee5;
      --green: #168a50;
      --red: #c43b3b;
      --blue: #2359a7;
      --gold: #b8860b;
      --purple: #7a4eb3;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(10px);
    }

    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0;
    }

    main {
      width: min(1500px, 100%);
      margin: 0 auto;
      padding: 20px;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      border-color: #9ca8b5;
    }

    .status {
      font-size: 13px;
      color: var(--muted);
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .metrics {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .charts {
      grid-template-columns: 1.15fr 0.85fr;
      margin-top: 14px;
    }

    .wide {
      grid-column: 1 / -1;
    }

    .panel,
    .metric,
    .asset-table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
    }

    .metric {
      padding: 14px;
      min-height: 92px;
    }

    .metric .label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      text-transform: uppercase;
    }

    .metric .value {
      margin-top: 8px;
      font-size: 25px;
      font-weight: 760;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .metric .sub {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .panel {
      min-height: 340px;
      padding: 14px;
    }

    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
    }

    .panel-note {
      color: var(--muted);
      font-size: 12px;
      text-align: right;
    }

    .chart-box {
      position: relative;
      height: 285px;
    }

    .asset-table-wrap {
      margin-top: 14px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 940px;
      font-size: 13px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child,
    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    th {
      position: sticky;
      top: 0;
      background: #fbfcfd;
      color: var(--muted);
      font-weight: 700;
    }

    .positive {
      color: var(--green);
    }

    .negative {
      color: var(--red);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #eef2f7;
      color: #3d4854;
      font-size: 12px;
      font-weight: 700;
    }

    .risk-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .risk-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
    }

    .error {
      margin-top: 14px;
      padding: 12px;
      border: 1px solid #f0c2c2;
      border-radius: 6px;
      background: #fff5f5;
      color: #9b2424;
      display: none;
    }

    @media (max-width: 960px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        padding: 14px;
      }

      .metrics,
      .charts {
        grid-template-columns: 1fr;
      }

      .metric .value {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>QuantBot Asset Dashboard</h1>
      <div class="status" id="status">正在读取资产快照...</div>
    </div>
    <button id="refreshBtn" type="button">刷新</button>
  </header>

  <main>
    <section class="grid metrics" aria-label="portfolio metrics">
      <div class="metric">
        <div class="label">Total AUM</div>
        <div class="value" id="aum">--</div>
        <div class="sub" id="runId">--</div>
      </div>
      <div class="metric">
        <div class="label">Daily P/L</div>
        <div class="value" id="dailyProfit">--</div>
        <div class="sub" id="dailyPct">--</div>
      </div>
      <div class="metric">
        <div class="label">Largest Asset</div>
        <div class="value" id="largestAsset">--</div>
        <div class="sub" id="largestAssetValue">--</div>
      </div>
      <div class="metric">
        <div class="label">Risk Flag</div>
        <div class="value" id="riskFlag">--</div>
        <div class="sub" id="riskSub">--</div>
      </div>
    </section>

    <div class="error" id="error"></div>

    <section class="grid charts">
      <div class="panel">
        <div class="panel-head">
          <h2>AUM & P/L History</h2>
          <div class="panel-note">最近 120 条记录</div>
        </div>
        <div class="chart-box"><canvas id="historyChart"></canvas></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Current Allocation</h2>
          <div class="panel-note">实际仓位</div>
        </div>
        <div class="chart-box"><canvas id="allocationChart"></canvas></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Target Drift</h2>
          <div class="panel-note">实际 - 目标</div>
        </div>
        <div class="chart-box"><canvas id="driftChart"></canvas></div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h2>Daily Profit Contribution</h2>
          <div class="panel-note">按底层资产</div>
        </div>
        <div class="chart-box"><canvas id="profitChart"></canvas></div>
      </div>

      <div class="panel wide">
        <div class="panel-head">
          <h2>Risk & Action Signals</h2>
          <div class="panel-note">资产桶状态</div>
        </div>
        <ul class="risk-list" id="riskList"></ul>
      </div>
    </section>

    <section class="asset-table-wrap" aria-label="asset snapshots">
      <table>
        <thead>
          <tr>
            <th>资产</th>
            <th>职责桶</th>
            <th>币种</th>
            <th>数量</th>
            <th>本币市值</th>
            <th>人民币市值</th>
            <th>日盈亏</th>
            <th>涨跌幅</th>
          </tr>
        </thead>
        <tbody id="assetRows"></tbody>
      </table>
    </section>
  </main>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxsZpvRQMGmayN7qupw0Ul_IqyxyJPcO76_QfjJWeDjR6LqLt9ZcCpDJlpf4sFLbi_x/exec";
    const bucketLabels = {
      beta_core: "Beta核心仓",
      alpha_satellite: "Alpha卫星仓",
      defense: "防守仓",
      liquidity: "流动性弹药",
    };
    const bucketColors = ["#2359a7", "#7a4eb3", "#b8860b", "#168a50"];
    const charts = {};

    document.getElementById("refreshBtn").addEventListener("click", loadDashboard);
    loadDashboard();

    function jsonp(url) {
      return new Promise((resolve, reject) => {
        const callback = `quantbotDashboard_${Date.now()}_${Math.round(Math.random() * 10000)}`;
        const script = document.createElement("script");
        const timeout = window.setTimeout(() => {
          cleanup();
          reject(new Error("数据读取超时"));
        }, 20000);

        window[callback] = (payload) => {
          cleanup();
          resolve(payload);
        };

        function cleanup() {
          window.clearTimeout(timeout);
          delete window[callback];
          script.remove();
        }

        script.onerror = () => {
          cleanup();
          reject(new Error("无法读取 Google Sheet 数据接口"));
        };
        script.src = `${url}?callback=${callback}&limit=120&view=official&ts=${Date.now()}`;
        document.body.appendChild(script);
      });
    }

    async function loadDashboard() {
      setStatus("正在读取资产快照...");
      hideError();
      try {
        const data = await jsonp(WEB_APP_URL);
        if (!data || data.status !== "Success") {
          throw new Error("数据接口没有返回 Success");
        }
        render(data);
      } catch (error) {
        showError(error.message);
        setStatus("读取失败");
      }
    }

    function render(data) {
      const history = normalizeRows(data.history || []);
      const assets = normalizeRows(data.assets || []);
      if (history.length === 0) {
        throw new Error("还没有正式记录。等 09:00 / 17:00 定时任务跑完后，这里会自动显示；临时手动运行不会进入主视图。");
      }
      const latest = history[history.length - 1] || {};
      const sortedAssets = [...assets].sort((a, b) => number(b.cny_value) - number(a.cny_value));
      const largest = sortedAssets[0] || {};
      const risk = riskSummary(latest);

      document.getElementById("aum").textContent = money(latest.total_value);
      document.getElementById("runId").textContent = latest.timestamp || data.latest_run_id || "--";
      setSignedMetric("dailyProfit", latest.daily_profit, money);
      setSignedMetric("dailyPct", latest.daily_change_pct, (value) => `${number(value).toFixed(2)}%`);
      document.getElementById("largestAsset").textContent = largest.asset_name || "--";
      document.getElementById("largestAssetValue").textContent = largest.cny_value ? money(largest.cny_value) : "--";
      document.getElementById("riskFlag").textContent = risk.title;
      document.getElementById("riskSub").textContent = risk.subtitle;

      renderHistoryChart(history);
      renderAllocationChart(latest);
      renderDriftChart(latest);
      renderProfitChart(assets);
      renderRiskList(latest);
      renderAssetRows(sortedAssets);

      const hiddenRows = Math.max(number(data.total_history_rows) - number(data.visible_history_rows), 0);
      setStatus(`正式视图：${latest.timestamp || data.generated_at || "--"}，资产 ${assets.length} 项，已隐藏临时记录 ${hiddenRows} 条`);
    }

    function normalizeRows(rows) {
      return rows.map((row) => {
        const normalized = {};
        Object.keys(row).forEach((key) => {
          normalized[key] = row[key] === "" ? null : row[key];
        });
        return normalized;
      });
    }

    function renderHistoryChart(history) {
      const labels = history.map((row) => shortTime(row.timestamp || row.date));
      const aum = history.map((row) => number(row.total_value));
      const profit = history.map((row) => number(row.daily_profit));
      replaceChart("historyChart", {
        type: "line",
        data: {
          labels,
          datasets: [
            {
              label: "AUM",
              data: aum,
              borderColor: "#2359a7",
              backgroundColor: "rgba(35, 89, 167, 0.08)",
              yAxisID: "y",
              tension: 0.28,
              pointRadius: 2,
            },
            {
              label: "Daily P/L",
              data: profit,
              type: "bar",
              backgroundColor: profit.map((value) => value >= 0 ? "rgba(22, 138, 80, 0.42)" : "rgba(196, 59, 59, 0.42)"),
              yAxisID: "y1",
            },
          ],
        },
        options: baseOptions({
          y: { ticks: { callback: compactMoney } },
          y1: { position: "right", grid: { drawOnChartArea: false }, ticks: { callback: compactMoney } },
        }),
      });
    }

    function renderAllocationChart(latest) {
      const values = bucketKeys().map((key) => number(latest[`${key}_weight`]) * 100);
      replaceChart("allocationChart", {
        type: "doughnut",
        data: {
          labels: bucketKeys().map((key) => bucketLabels[key]),
          datasets: [{ data: values, backgroundColor: bucketColors, borderWidth: 0 }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { position: "bottom" },
            tooltip: { callbacks: { label: (ctx) => `${ctx.label}: ${ctx.raw.toFixed(1)}%` } },
          },
        },
      });
    }

    function renderDriftChart(latest) {
      const drifts = bucketKeys().map((key) => number(latest[`${key}_diff`]) * 100);
      replaceChart("driftChart", {
        type: "bar",
        data: {
          labels: bucketKeys().map((key) => bucketLabels[key]),
          datasets: [{
            label: "偏离百分比",
            data: drifts,
            backgroundColor: drifts.map((value) => value >= 0 ? "rgba(196, 59, 59, 0.65)" : "rgba(22, 138, 80, 0.65)"),
          }],
        },
        options: baseOptions({ y: { ticks: { callback: (value) => `${value}%` } } }),
      });
    }

    function renderProfitChart(assets) {
      const ranked = [...assets]
        .sort((a, b) => Math.abs(number(b.daily_profit)) - Math.abs(number(a.daily_profit)))
        .slice(0, 12)
        .reverse();
      const values = ranked.map((asset) => number(asset.daily_profit));
      replaceChart("profitChart", {
        type: "bar",
        data: {
          labels: ranked.map((asset) => asset.asset_name),
          datasets: [{
            label: "日盈亏",
            data: values,
            backgroundColor: values.map((value) => value >= 0 ? "rgba(22, 138, 80, 0.65)" : "rgba(196, 59, 59, 0.65)"),
          }],
        },
        options: baseOptions({ x: { ticks: { callback: compactMoney } } }, true),
      });
    }

    function renderRiskList(latest) {
      const list = document.getElementById("riskList");
      list.innerHTML = "";
      bucketKeys().forEach((key) => {
        const status = latest[`${key}_status`] || "--";
        const diff = number(latest[`${key}_diff`]) * 100;
        const value = number(latest[`${key}_value`]);
        const item = document.createElement("li");
        item.innerHTML = `
          <span><strong>${bucketLabels[key]}</strong> <span class="status">${money(value)} / 偏离 ${diff.toFixed(1)}%</span></span>
          <span class="badge">${statusLabel(status)}</span>
        `;
        list.appendChild(item);
      });
    }

    function renderAssetRows(assets) {
      const rows = document.getElementById("assetRows");
      rows.innerHTML = assets.map((asset) => {
        const profit = number(asset.daily_profit);
        const pct = number(asset.daily_change_pct);
        return `
          <tr>
            <td>${escapeHtml(asset.asset_name || "--")}</td>
            <td>${escapeHtml(asset.bucket_label || asset.bucket || "--")}</td>
            <td>${escapeHtml(asset.currency || "--")}</td>
            <td>${formatNumber(asset.quantity)}</td>
            <td>${formatNumber(asset.local_value)}</td>
            <td>${money(asset.cny_value)}</td>
            <td class="${profit >= 0 ? "positive" : "negative"}">${money(profit)}</td>
            <td class="${pct >= 0 ? "positive" : "negative"}">${pct.toFixed(2)}%</td>
          </tr>
        `;
      }).join("");
    }

    function replaceChart(id, config) {
      if (charts[id]) charts[id].destroy();
      charts[id] = new Chart(document.getElementById(id), config);
    }

    function baseOptions(scales, horizontal = false) {
      return {
        indexAxis: horizontal ? "y" : "x",
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: "bottom" },
          tooltip: { intersect: false, mode: "index" },
        },
        scales: scales || {},
      };
    }

    function bucketKeys() {
      return ["beta_core", "alpha_satellite", "defense", "liquidity"];
    }

    function riskSummary(latest) {
      const bad = bucketKeys().filter((key) => latest[`${key}_status`] && latest[`${key}_status`] !== "OK");
      if (bad.length === 0) {
        return { title: "Balanced", subtitle: "资产桶均在容忍区间内" };
      }
      return { title: "Needs Action", subtitle: bad.map((key) => bucketLabels[key]).join("、") };
    }

    function statusLabel(status) {
      if (status === "OK") return "区间内";
      if (status === "OVERWEIGHT") return "超配";
      if (status === "UNDERWEIGHT") return "低配";
      return status || "--";
    }

    function setSignedMetric(id, value, formatter) {
      const element = document.getElementById(id);
      const numeric = number(value);
      element.textContent = formatter(numeric);
      element.classList.toggle("positive", numeric >= 0);
      element.classList.toggle("negative", numeric < 0);
    }

    function money(value) {
      return `¥${number(value).toLocaleString("zh-CN", { maximumFractionDigits: 2 })}`;
    }

    function compactMoney(value) {
      const numeric = number(value);
      if (Math.abs(numeric) >= 10000) return `¥${(numeric / 10000).toFixed(1)}万`;
      return `¥${numeric.toFixed(0)}`;
    }

    function formatNumber(value) {
      return number(value).toLocaleString("zh-CN", { maximumFractionDigits: 4 });
    }

    function number(value) {
      const numeric = Number(value);
      return Number.isFinite(numeric) ? numeric : 0;
    }

    function shortTime(value) {
      if (!value) return "--";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value).slice(5, 16);
      return `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;",
      }[char]));
    }

    function setStatus(text) {
      document.getElementById("status").textContent = text;
    }

    function showError(message) {
      const error = document.getElementById("error");
      error.textContent = message;
      error.style.display = "block";
    }

    function hideError() {
      document.getElementById("error").style.display = "none";
    }
  </script>
</body>
</html>
