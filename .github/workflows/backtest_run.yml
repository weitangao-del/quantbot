name: 1-Year Portfolio Backtest

on:
  workflow_dispatch: # 仅允许手动点击运行

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yfinance requests

      - name: Execute Backtest
        env:
          MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python backtest_engine.py
