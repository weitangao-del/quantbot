name: QuantBot V2 (Multi-Currency Engine)

on:
  schedule:
    # 严格按照 Cron 表达式执行：UTC 01:00 和 13:00 (北京时间 09:00 和 21:00)
    - cron: '0 1,13 * * *'
  workflow_dispatch: 
    # 架构师准则：永远保留手动触发按钮，方便盘中随时强行调取报告

jobs:
  run-v2-engine:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: ⚙️ Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # 开启缓存，加速每次运行的依赖安装

    - name: 📦 Install Quant Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests ccxt akshare yfinance

    - name: 🚀 Execute Portfolio V2 Engine
      env:
        # 严格从 GitHub Secrets 注入环境变量，你的原版 Secret 直接复用即可
        MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PORTFOLIO_CSV_URL: ${{ secrets.PORTFOLIO_CSV_URL }}
        HISTORY_WEBAPP_URL: ${{ secrets.HISTORY_WEBAPP_URL }}
      run: |
        # 瞄准你新建的 V2 文件执行
        python portfolio_2.py
