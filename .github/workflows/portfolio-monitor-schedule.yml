name: Portfolio Monitor Schedule

on:
  # Legacy manual fallback only. Production scheduling is owned by
  # Cloudflare Worker crons in cloudflare-worker/wrangler.toml.
  workflow_dispatch:
    inputs:
      run_slot:
        description: Manual schedule slot override
        required: false
        type: string
      trigger_source:
        description: Trigger source label
        required: false
        type: string

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: portfolio-monitor
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Skip duplicate scheduled snapshot
        id: dedupe
        env:
          HISTORY_WEBAPP_URL: ${{ secrets.HISTORY_WEBAPP_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          REPORT_TIMEZONE: Asia/Shanghai
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          schedules = {
              "7 16 * * *": ("ad_hoc_0000", "午夜资产快照", False),
              "17 16 * * *": ("ad_hoc_0000", "午夜资产快照", False),
              "27 16 * * *": ("ad_hoc_0000", "午夜资产快照", False),
              "17 17 * * *": ("ad_hoc_0000", "午夜资产快照", False),
              "17 18 * * *": ("ad_hoc_0000", "午夜资产快照", False),
              "7 22 * * *": ("ad_hoc_0600", "早盘资产快照", False),
              "17 22 * * *": ("ad_hoc_0600", "早盘资产快照", False),
              "27 22 * * *": ("ad_hoc_0600", "早盘资产快照", False),
              "17 23 * * *": ("ad_hoc_0600", "早盘资产快照", False),
              "17 0 * * *": ("ad_hoc_0600", "早盘资产快照", False),
              "7 4 * * *": ("ad_hoc_1200", "午间资产快照", False),
              "17 4 * * *": ("ad_hoc_1200", "午间资产快照", False),
              "27 4 * * *": ("ad_hoc_1200", "午间资产快照", False),
              "17 5 * * *": ("ad_hoc_1200", "午间资产快照", False),
              "17 6 * * *": ("ad_hoc_1200", "午间资产快照", False),
              "17 7 * * *": ("ad_hoc_1200", "午间资产快照", False),
              "17 8 * * *": ("ad_hoc_1200", "午间资产快照", False),
              "7 10 * * *": ("official_1800", "晚盘正式结算", True),
              "17 10 * * *": ("official_1800", "晚盘正式结算", True),
              "27 10 * * *": ("official_1800", "晚盘正式结算", True),
              "17 11 * * *": ("official_1800", "晚盘正式结算", True),
              "17 12 * * *": ("official_1800", "晚盘正式结算", True),
              "17 13 * * *": ("official_1800", "晚盘正式结算", True),
              "17 14 * * *": ("official_1800", "晚盘正式结算", True),
          }

          allowed_hours_by_slot = {
              "ad_hoc_0000": {0, 1, 2},
              "ad_hoc_0600": {6, 7, 8},
              "ad_hoc_1200": {12, 13, 14, 15, 16},
              "official_1800": {18, 19, 20, 21, 22},
          }
          primary_crons = {"7 16 * * *", "7 22 * * *", "7 4 * * *", "7 10 * * *"}

          def truthy(value):
              return value is True or str(value).strip().lower() in {"true", "1", "yes"}

          def local_date(row, timezone):
              for key in ("timestamp", "Timestamp", "date", "Date"):
                  value = row.get(key)
                  if not value:
                      continue
                  try:
                      parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone)
                  return parsed.astimezone(timezone).strftime("%Y-%m-%d")
              run_id = str(row.get("run_id") or row.get("Run_ID") or "")
              if len(run_id) >= 8 and run_id[:8].isdigit():
                  return f"{run_id[:4]}-{run_id[4:6]}-{run_id[6:8]}"
              return ""

          def row_hour(row, timezone):
              for key in ("timestamp", "Timestamp"):
                  value = row.get(key)
                  if not value:
                      continue
                  try:
                      parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone)
                  return parsed.astimezone(timezone).hour
              return None

          def row_matches_slot(row, slot, timezone):
              allowed_hours = allowed_hours_by_slot.get(slot)
              if not allowed_hours:
                  return True
              row_hour_value = row_hour(row, timezone)
              if row_hour_value is None:
                  return True
              return row_hour_value in allowed_hours

          skip = False
          cron = os.getenv("GITHUB_EVENT_SCHEDULE", "")
          history_url = os.getenv("HISTORY_WEBAPP_URL", "")
          timezone = ZoneInfo(os.getenv("REPORT_TIMEZONE", "Asia/Shanghai"))
          now_local = datetime.now(timezone)
          today = now_local.strftime("%Y-%m-%d")
          slot, session, official = schedules.get(cron, ("", "", False))
          allowed_hours = allowed_hours_by_slot.get(slot)

          if os.getenv("GITHUB_EVENT_NAME") == "schedule" and allowed_hours and now_local.hour not in allowed_hours:
              skip = True
              print(
                  "stale_schedule_skip: "
                  f"cron={cron} slot={slot} local_time={now_local.isoformat()} "
                  f"allowed_hours={sorted(allowed_hours)}"
              )
          elif os.getenv("GITHUB_EVENT_NAME") == "schedule" and history_url and slot:
              try:
                  with urllib.request.urlopen(f"{history_url}?view=all&limit=240", timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  for row in payload.get("history", []):
                      if local_date(row, timezone) != today:
                          continue
                      if row.get("schedule_slot") == slot and row_matches_slot(row, slot, timezone):
                          skip = True
                          break
                      if str(row.get("session") or "").strip() == session and row_matches_slot(row, slot, timezone):
                          skip = True
                          break
                      if official and truthy(row.get("is_official_report")) and row_matches_slot(row, slot, timezone):
                          skip = True
                          break
              except Exception as error:
                  if cron in primary_crons:
                      print(f"duplicate_check_warning: {type(error).__name__}: {error}; primary cron will run")
                      skip = False
                  else:
                      print(f"duplicate_check_warning: {type(error).__name__}: {error}; backup cron will skip")
                      skip = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if skip else 'false'}\n")
              output.write(f"run_slot={slot}\n")
          print(f"duplicate_check: cron={cron} slot={slot} session={session} skip={skip}")
          PY

      - name: Install dependencies
        if: ${{ steps.dedupe.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run portfolio monitor
        if: ${{ steps.dedupe.outputs.skip != 'true' }}
        env:
          MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORTFOLIO_CSV_URL: ${{ secrets.PORTFOLIO_CSV_URL }}
          HISTORY_WEBAPP_URL: ${{ secrets.HISTORY_WEBAPP_URL }}
          REPORT_TIMEZONE: Asia/Shanghai
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_SLOT_OVERRIDE: ${{ steps.dedupe.outputs.run_slot || github.event.inputs.run_slot }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
        run: python portfolio_monitor.py
