name: Portfolio Monitor Schedule

on:
  schedule:
    # Beijing 00:07/00:17/00:27
    - cron: "7 16 * * *"
    - cron: "17 16 * * *"
    - cron: "27 16 * * *"
    # Beijing 06:07/06:17/06:27
    - cron: "7 22 * * *"
    - cron: "17 22 * * *"
    - cron: "27 22 * * *"
    # Beijing 12:07/12:17/12:27
    - cron: "7 4 * * *"
    - cron: "17 4 * * *"
    - cron: "27 4 * * *"
    # Beijing 18:07/18:17/18:27 official
    - cron: "7 10 * * *"
    - cron: "17 10 * * *"
    - cron: "27 10 * * *"
  workflow_dispatch:
    inputs:
      run_slot:
        description: Manual schedule slot override
        required: false
        type: string
      trigger_source:
        description: Trigger source label
        required: false
        type: string

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: portfolio-monitor
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run portfolio monitor
        env:
          MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORTFOLIO_CSV_URL: ${{ secrets.PORTFOLIO_CSV_URL }}
          HISTORY_WEBAPP_URL: ${{ secrets.HISTORY_WEBAPP_URL }}
          REPORT_TIMEZONE: Asia/Shanghai
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_SLOT_OVERRIDE: ${{ github.event.inputs.run_slot }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
        run: python portfolio_monitor.py
