name: Portfolio Monitor Schedule

on:
  schedule:
    # GitHub scheduled workflows can be delayed or occasionally dropped when many
    # discrete cron entries are used. Wake frequently, then gate by Beijing time
    # and existing sheet records inside the workflow.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      run_slot:
        description: Manual schedule slot override
        required: false
        type: string
      trigger_source:
        description: Trigger source label
        required: false
        type: string

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: portfolio-monitor
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Skip duplicate scheduled snapshot
        id: dedupe
        env:
          HISTORY_WEBAPP_URL: ${{ secrets.HISTORY_WEBAPP_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_RUN_SLOT: ${{ github.event.inputs.run_slot }}
          REPORT_TIMEZONE: Asia/Shanghai
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          slot_specs = {
              "ad_hoc_0000": ("午夜资产快照", False, {0, 1, 2}),
              "ad_hoc_0600": ("早盘资产快照", False, {6, 7, 8}),
              "ad_hoc_1200": ("午间资产快照", False, {12, 13, 14, 15, 16}),
              "official_1800": ("晚盘正式结算", True, {18, 19, 20, 21, 22}),
          }

          def truthy(value):
              return value is True or str(value).strip().lower() in {"true", "1", "yes"}

          def slot_for_hour(hour):
              for slot_name, (_, _, allowed_hours) in slot_specs.items():
                  if hour in allowed_hours:
                      return slot_name
              return ""

          def local_date(row, timezone):
              for key in ("timestamp", "Timestamp", "date", "Date"):
                  value = row.get(key)
                  if not value:
                      continue
                  try:
                      parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone)
                  return parsed.astimezone(timezone).strftime("%Y-%m-%d")
              run_id = str(row.get("run_id") or row.get("Run_ID") or "")
              if len(run_id) >= 8 and run_id[:8].isdigit():
                  return f"{run_id[:4]}-{run_id[4:6]}-{run_id[6:8]}"
              return ""

          def row_hour(row, timezone):
              for key in ("timestamp", "Timestamp"):
                  value = row.get(key)
                  if not value:
                      continue
                  try:
                      parsed = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  except ValueError:
                      continue
                  if parsed.tzinfo is None:
                      parsed = parsed.replace(tzinfo=timezone)
                  return parsed.astimezone(timezone).hour
              return None

          def row_matches_slot(row, slot, timezone):
              allowed_hours = slot_specs.get(slot, ("", False, set()))[2]
              if not allowed_hours:
                  return True
              row_hour_value = row_hour(row, timezone)
              if row_hour_value is None:
                  return True
              return row_hour_value in allowed_hours

          event_name = os.getenv("GITHUB_EVENT_NAME", "")
          cron = os.getenv("GITHUB_EVENT_SCHEDULE", "")
          manual_slot = os.getenv("MANUAL_RUN_SLOT", "").strip()
          history_url = os.getenv("HISTORY_WEBAPP_URL", "")
          timezone = ZoneInfo(os.getenv("REPORT_TIMEZONE", "Asia/Shanghai"))
          now_local = datetime.now(timezone)
          today = now_local.strftime("%Y-%m-%d")

          skip = False
          if event_name == "schedule":
              slot = slot_for_hour(now_local.hour)
          elif manual_slot in slot_specs:
              slot = manual_slot
          else:
              slot = slot_for_hour(now_local.hour)

          session, official, allowed_hours = slot_specs.get(slot, ("", False, set()))

          if event_name == "schedule" and not slot:
              skip = True
              print(f"idle_schedule_skip: cron={cron} local_time={now_local.isoformat()}")
          elif event_name == "schedule" and history_url and slot:
              try:
                  with urllib.request.urlopen(f"{history_url}?view=all&limit=240", timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  for row in payload.get("history", []):
                      if local_date(row, timezone) != today:
                          continue
                      if row.get("schedule_slot") == slot and row_matches_slot(row, slot, timezone):
                          skip = True
                          break
                      if str(row.get("session") or "").strip() == session and row_matches_slot(row, slot, timezone):
                          skip = True
                          break
                      if official and truthy(row.get("is_official_report")) and row_matches_slot(row, slot, timezone):
                          skip = True
                          break
              except Exception as error:
                  print(f"duplicate_check_warning: {type(error).__name__}: {error}; scheduled slot will run")
                  skip = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if skip else 'false'}\n")
              output.write(f"run_slot={slot}\n")
          print(
              "schedule_gate: "
              f"event={event_name} cron={cron} slot={slot} session={session} "
              f"local_time={now_local.isoformat()} skip={skip}"
          )
          PY

      - name: Install dependencies
        if: ${{ steps.dedupe.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run portfolio monitor
        if: ${{ steps.dedupe.outputs.skip != 'true' }}
        env:
          MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORTFOLIO_CSV_URL: ${{ secrets.PORTFOLIO_CSV_URL }}
          HISTORY_WEBAPP_URL: ${{ secrets.HISTORY_WEBAPP_URL }}
          REPORT_TIMEZONE: Asia/Shanghai
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_SLOT_OVERRIDE: ${{ steps.dedupe.outputs.run_slot }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
        run: python portfolio_monitor.py
