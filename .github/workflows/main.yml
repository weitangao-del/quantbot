name: Portfolio Monitor

on:
  schedule:
    - cron: "0 16 * * *" # Beijing 00:00
    - cron: "0 22 * * *" # Beijing 06:00
    - cron: "0 4 * * *" # Beijing 12:00
    - cron: "0 10 * * *" # Beijing 18:00 official
  workflow_dispatch:
    inputs:
      run_slot:
        description: Cloudflare schedule slot override
        required: false
        type: string
      trigger_source:
        description: Trigger source label
        required: false
        type: string

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: portfolio-monitor
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run portfolio monitor
        env:
          MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORTFOLIO_CSV_URL: ${{ secrets.PORTFOLIO_CSV_URL }}
          HISTORY_WEBAPP_URL: ${{ secrets.HISTORY_WEBAPP_URL }}
          REPORT_TIMEZONE: Asia/Shanghai
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_SLOT_OVERRIDE: ${{ github.event.inputs.run_slot }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
        run: python portfolio_monitor.py
