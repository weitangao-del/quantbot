name: Portfolio Monitor & Rebalance Engine

on:
  workflow_dispatch: 
  schedule:
    - cron: '40 14 * * *'

# 🚀 终极杀手锏：在全局环境变量中强制启用 Node.js 24，彻底封杀警告！
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests ccxt akshare yfinance pandas

    - name: Execute Strategy Engine
      env:
        MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PORTFOLIO_CSV_URL: ${{ secrets.PORTFOLIO_CSV_URL }}
      run: |
        python portfolio_monitor_github.py
