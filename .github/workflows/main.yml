name: Portfolio Monitor

on:
  schedule:
    - cron: "0 16 * * *"
    - cron: "20 16 * * *"
    - cron: "40 16 * * *"
    - cron: "20 17 * * *"
    - cron: "0 22 * * *"
    - cron: "20 22 * * *"
    - cron: "40 22 * * *"
    - cron: "20 23 * * *"
    - cron: "0 4 * * *"
    - cron: "20 4 * * *"
    - cron: "40 4 * * *"
    - cron: "20 5 * * *"
    - cron: "0 10 * * *"
    - cron: "20 10 * * *"
    - cron: "40 10 * * *"
    - cron: "20 11 * * *"
  workflow_dispatch:
    inputs:
      run_slot:
        description: Cloudflare schedule slot override
        required: false
        type: string
      trigger_source:
        description: Trigger source label
        required: false
        type: string

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: portfolio-monitor
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard stale dispatch slot
        id: slot_guard
        shell: bash
        env:
          REPORT_TIMEZONE: Asia/Shanghai
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_SLOT_OVERRIDE: ${{ github.event.inputs.run_slot }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          allowed_hours_by_slot = {
              "ad_hoc_0000": {0, 1, 2},
              "ad_hoc_0600": {6, 7, 8},
              "ad_hoc_1200": {12, 13, 14, 15, 16},
              "official_1800": {18, 19, 20, 21, 22},
          }
          schedules = {
              "0 16 * * *": "ad_hoc_0000",
              "20 16 * * *": "ad_hoc_0000",
              "40 16 * * *": "ad_hoc_0000",
              "20 17 * * *": "ad_hoc_0000",
              "0 22 * * *": "ad_hoc_0600",
              "20 22 * * *": "ad_hoc_0600",
              "40 22 * * *": "ad_hoc_0600",
              "20 23 * * *": "ad_hoc_0600",
              "0 4 * * *": "ad_hoc_1200",
              "20 4 * * *": "ad_hoc_1200",
              "40 4 * * *": "ad_hoc_1200",
              "20 5 * * *": "ad_hoc_1200",
              "0 10 * * *": "official_1800",
              "20 10 * * *": "official_1800",
              "40 10 * * *": "official_1800",
              "20 11 * * *": "official_1800",
          }

          event_name = os.getenv("GITHUB_EVENT_NAME", "").strip()
          event_schedule = os.getenv("GITHUB_EVENT_SCHEDULE", "").strip()
          slot = os.getenv("RUN_SLOT_OVERRIDE", "").strip()
          if not slot and event_name == "schedule":
              slot = schedules.get(event_schedule, "")
          timezone = ZoneInfo(os.getenv("REPORT_TIMEZONE", "Asia/Shanghai"))
          now = datetime.now(timezone)
          allowed_hours = allowed_hours_by_slot.get(slot)
          skip = bool(allowed_hours and now.hour not in allowed_hours)

          if skip:
              reason = "stale_schedule_skip" if event_name == "schedule" else "stale_dispatch_skip"
              print(
                  f"{reason}: "
                  f"slot={slot} local_time={now.isoformat()} "
                  f"allowed_hours={sorted(allowed_hours)}"
              )
          else:
              print(f"dispatch_slot_ok: slot={slot or 'manual'} local_time={now.isoformat()}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"skip={'true' if skip else 'false'}\n")
              output.write(f"run_slot={slot}\n")
          PY

      - name: Install dependencies
        if: ${{ steps.slot_guard.outputs.skip != 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run portfolio monitor
        if: ${{ steps.slot_guard.outputs.skip != 'true' }}
        env:
          MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORTFOLIO_CSV_URL: ${{ secrets.PORTFOLIO_CSV_URL }}
          HISTORY_WEBAPP_URL: ${{ secrets.HISTORY_WEBAPP_URL }}
          REPORT_TIMEZONE: Asia/Shanghai
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_SLOT_OVERRIDE: ${{ steps.slot_guard.outputs.run_slot || github.event.inputs.run_slot }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
        run: python portfolio_monitor_guarded.py
