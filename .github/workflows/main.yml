name: Portfolio Monitor

on:
  schedule:
    # Beijing 00:00 / 06:00 / 12:00 / 18:00. GitHub may run late,
    # so this workflow maps github.event.schedule back to the intended slot.
    - cron: "0 16 * * *"
    - cron: "0 22 * * *"
    - cron: "0 4 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      run_slot:
        description: Cloudflare schedule slot override
        required: false
        type: string
      trigger_source:
        description: Trigger source label
        required: false
        type: string

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: portfolio-monitor
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve schedule slot
        id: slot
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            "0 16 * * *") slot="ad_hoc_0000" ;;
            "0 22 * * *") slot="ad_hoc_0600" ;;
            "0 4 * * *") slot="ad_hoc_1200" ;;
            "0 10 * * *") slot="official_1800" ;;
            *) slot="${{ github.event.inputs.run_slot }}" ;;
          esac
          echo "run_slot=${slot}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run portfolio monitor
        env:
          MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORTFOLIO_CSV_URL: ${{ secrets.PORTFOLIO_CSV_URL }}
          HISTORY_WEBAPP_URL: ${{ secrets.HISTORY_WEBAPP_URL }}
          REPORT_TIMEZONE: Asia/Shanghai
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          RUN_SLOT_OVERRIDE: ${{ steps.slot.outputs.run_slot }}
          TRIGGER_SOURCE: ${{ github.event.inputs.trigger_source }}
        run: python portfolio_monitor.py
