name: Portfolio Monitor

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. Run several attempts in each Beijing
    # 6-hour window; portfolio_monitor.py dedupes after the first good record.
    # Beijing 09:07/09:17/09:27/09:37/09:47, official daily record.
    - cron: "7 1 * * *"
    - cron: "17 1 * * *"
    - cron: "27 1 * * *"
    - cron: "37 1 * * *"
    - cron: "47 1 * * *"
    # Beijing 15:07/15:17/15:27/15:37/15:47, ad-hoc record.
    - cron: "7 7 * * *"
    - cron: "17 7 * * *"
    - cron: "27 7 * * *"
    - cron: "37 7 * * *"
    - cron: "47 7 * * *"
    # Beijing 21:07/21:17/21:27/21:37/21:47, ad-hoc record.
    - cron: "7 13 * * *"
    - cron: "17 13 * * *"
    - cron: "27 13 * * *"
    - cron: "37 13 * * *"
    - cron: "47 13 * * *"
    # Beijing 03:07/03:17/03:27/03:37/03:47, ad-hoc record.
    - cron: "7 19 * * *"
    - cron: "17 19 * * *"
    - cron: "27 19 * * *"
    - cron: "37 19 * * *"
    - cron: "47 19 * * *"

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: portfolio-monitor
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run portfolio monitor
        env:
          MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PORTFOLIO_CSV_URL: ${{ secrets.PORTFOLIO_CSV_URL }}
          HISTORY_WEBAPP_URL: ${{ secrets.HISTORY_WEBAPP_URL }}
          REPORT_TIMEZONE: Asia/Shanghai
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python portfolio_monitor.py
