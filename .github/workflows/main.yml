name: Portfolio Monitor & Rebalance Engine

on:
  workflow_dispatch: 
  schedule:
    - cron: '40 14 * * *'

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      # 🚀 升级底层拉取插件至 v4 (适配最新 Node 环境)
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      # 🚀 升级 Python 环境配置插件至 v5
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Core Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests ccxt akshare yfinance pandas

    - name: Execute Strategy Engine
      env:
        MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PORTFOLIO_CSV_URL: ${{ secrets.PORTFOLIO_CSV_URL }}
      run: |
        python portfolio_monitor_github.py
