name: 🏦 Macro Yield Monitor

on:
  workflow_dispatch:  # 允许在 GitHub 网页端手动触发
  schedule:
    # 每天 UTC 时间 01:15 和 13:15 执行 (避开整点高峰期)
    - cron: '15 1,13 * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 📦 Install Dependencies
        # 独立脚本只依赖 requests，保持极度轻量级
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Run Macro Yield Monitor
        env:
          # 从 GitHub Secrets 读取环境变量，绝对禁止硬编码
          MACRO_BOT_TOKEN: ${{ secrets.MACRO_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python macro_yield_monitor.py
